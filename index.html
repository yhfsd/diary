<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- 파비콘 설정하기  -->
  <link rel="icon" type="image/svg+xml" href="/diary/favicon.ico" />
  <!-- iOS에서 홈 화면에 앱 추가 시 사용될 아이콘 설정 -->
  <link rel="apple-touch-icon" href="/diary/logo192.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 모바일에서 실행될 때의 상단 테마 색 지정 -->
  <meta name="theme-color" content="#000000" />

  <!-- 페이지 설명 (검색 엔진, SNS 등에서 사용되는 부분 지정) -->
  <meta name="description" content="Web site created using create-react-app" />


  <!-- 
  PWA(Progressive Web App)용 웹앱 매니페스트 파일. 
  웹앱을 설치(홈 화면 추가)할 때 필요한 정보(앱 이름, 아이콘, 시작 URL 등)를 브라우저에 제공하는 파일 
  모바일 앱처럼 동작할 수 있도록 도와주는 중요한 구성 요소이다.
  -->
  <link rel="manifest" href="/diary/manifest.json" />

  <!-- 오픈그래프 태그: 페이스북, 카카오톡 등의 SNS에 링크를 공유할 때 
      썸네일, 페이지 제목, 간단한 설명 등도 함께 노출되도록 설정하는 태그를 말함. 
  -->
  <!-- og:image => 썸네일 이미지 -->
  <meta property="og:image" content="/diary/thumbnail.png" />
  <!-- og:title => 공유 제목 -->
  <meta property="og:title" content="감정 일기장" />
  <!-- og:description => 공유 설명 -->
  <meta property="og:description" content="나만의 작은 감정 일기장" />



  <title>Diary App</title>
  <script type="module" crossorigin src="/diary/assets/index-DmqL4xFk.js"></script>
  <link rel="stylesheet" crossorigin href="/diary/assets/index-CSPQBEmS.css">
</head>

<body>
  <div id="root"></div>
</body>

</html>
